  <script>
    window.__bootErrors=[]
    window.__appBooted=false
    window.__recordBootError=(message)=>{
      const text=String(message||'Application failed to load.').trim()
      if(!text)return
      window.__bootErrors.push(text)
      const render=()=>{
        const root=document.getElementById('root')
        if(!root||window.__appBooted)return
        root.innerHTML=`<div class="state" style="max-width:760px;margin:48px auto"><h3>Frontend failed to load</h3><p class="sub">${text}</p><p class="sub">If you are opening the app locally, make sure this browser can reach the required CDN scripts and then refresh the page.</p></div>`
      }
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render,{once:true})
      else render()
    }
    window.addEventListener('error',(event)=>{
      const source=event?.filename?` (${event.filename})`:''
      const message=event?.message||'JavaScript boot error'
      window.__recordBootError(`${message}${source}`)
    })
    window.addEventListener('unhandledrejection',(event)=>{
      window.__recordBootError(event?.reason?.message||event?.reason||'Unhandled promise rejection during app boot')
    })
    window.addEventListener('DOMContentLoaded',()=>{
      window.setTimeout(()=>{
        if(!window.__appBooted&&document.getElementById('root')&&!document.getElementById('root').children.length){
          const detail=window.__bootErrors[0]||'The UI bundle did not start. One of the required frontend scripts may have failed to load.'
          window.__recordBootError(detail)
        }
      },4000)
    })
  </script>

    const describeErrorDetail=(detail)=>{
      if(detail===null||detail===undefined)return''
      if(typeof detail==='string')return detail
      if(Array.isArray(detail)){
        const parts=detail.map((item)=>describeErrorDetail(item)).filter(Boolean)
        return parts.join(' | ')
      }
      if(typeof detail==='object'){
        const location=Array.isArray(detail.loc)?detail.loc.filter((part)=>part!=='body').join(' -> '):''
        const message=typeof detail.msg==='string'?detail.msg:''
        if(location&&message)return`${location}: ${message}`
        if(message)return message
        if(typeof detail.detail!=='undefined')return describeErrorDetail(detail.detail)
        try{return JSON.stringify(detail)}catch(parseError){return String(detail)}
      }
      return String(detail)
    }
    const getErrorMessage=(error,fallback='Request failed')=>{

          <div className="chain-flow">{(chain?.loans||[]).map((loan,index)=>{

                  <span className="chain-pill neutral">{TXT(lang,'Still Due','Still Due')}: {inr(loan?.balance_principal??loan?.outstanding_balance??0)}</span>
                </div>
                {virtualRollovers.length
                  ?<div className="virtual-rollover-list">{virtualRollovers.map((payment,paymentIndex)=>{
                    const successorSuffix=payment?.linked_successor_loan_id?` -> ${loanDisplayId(payment.linked_successor_loan_id)}`:''
                    const virtualAmount=payment?.amount??payment?.payment_amount??payment?.total_amount??0
                    return<span className="virtual-badge" key={payment?.payment_id||`${loan?.loan_id||'loan'}-roll-${paymentIndex}`}>{`${TXT(lang,'Old balance moved','Old balance moved')} ${inr(virtualAmount)}${successorSuffix}`}</span>
                  })}</div>
                  :null}
              </div>
              {index<(chain?.loans?.length||0)-1?<div className="chain-arrow">{TXT(lang,'Rollover ->','Rollover ->')}</div>:null}
            </React.Fragment>
          })}</div>
        </div>
      })}</div>
      :<Empty title={TXT(lang,'No loans found','No loans found')} body={TXT(lang,'This customer does not have any linked loans yet.','This customer does not have any linked loans yet.')} />
  })()}

function LoansV2({toast,customerState,currentUser,copy,lang}){
  const[loading,setLoading]=useState(true)
  const[error,setError]=useState('')
  const[rows,setRows]=useState([])
  const[payments,setPayments]=useState([])
  const[form,setForm]=useState({customer_id:'',new_disbursed_amount:'',add_on_principal:'0',rollover_source_loan_id:'',interest_rate:'0.02',transaction_type:'KULU',debt_interest_mode:'subsequent_collection',pre_deducted_interest:'0',start_date:toInputDate(new Date()),tenure_months:'',status:'ACTIVE',notes:''})
  const[filters,setFilters]=useState({customer_id:'',loan_type:'ALL',status:'ALL',overdue:'ALL',disbursed_from:'',disbursed_to:''})
  const[saving,setSaving]=useState(false)

  const load=async()=>{
    setLoading(true)
    setError('')
    try{
      const[loanRows,paymentRows]=await Promise.all([api.getLoans(),api.getPayments()])
      setRows(loanRows)
      setPayments(decoratePayments(paymentRows,loanRows))
    }catch(err){
      setError(err.message)
      toast('error','Loans unavailable',err.message)
    }finally{
      setLoading(false)
    }
  }

  useEffect(()=>{load()},[])
  useEffect(()=>{
    const handler=()=>load()
    window.addEventListener(PAYMENT_SAVED_EVENT,handler)
    return()=>window.removeEventListener(PAYMENT_SAVED_EVENT,handler)
  },[])

  const computedRows=useMemo(()=>buildLoanComputedRows(rows,payments),[rows,payments])
  const overdueMap=useMemo(()=>buildOverdueMap(computedRows.map((row)=>({...row,outstanding_balance:row.balance_principal})),payments),[computedRows,payments])
  const loanStatusOptions=useMemo(()=>getLoanStatusOptions(computedRows,true),[computedRows])
  const filteredRows=useMemo(()=>computedRows.filter((row)=>(!filters.customer_id||row.customer_id===filters.customer_id)&&(filters.loan_type==='ALL'||row.transaction_type===filters.loan_type)&&(filters.status==='ALL'||normalizeLoanStatusKey(row.raw_status||row.display_status||row.status)===filters.status)&&(filters.overdue==='ALL'||(overdueMap.get(row.loan_id)||{}).bucket===filters.overdue)&&(!filters.disbursed_from||row.start_date_iso>=filters.disbursed_from)&&(!filters.disbursed_to||row.start_date_iso<=filters.disbursed_to)),[computedRows,filters,overdueMap])
  const hasPageFilters=useMemo(()=>Object.entries(filters).some(([key,value])=>String(value||'')&&String(value)!=='ALL'),[filters])
  const activeLoanCount=useMemo(()=>filteredRows.filter((row)=>row.raw_status==='ACTIVE').length,[filteredRows])
  const overdueLoanCount=useMemo(()=>filteredRows.filter((row)=>['AT_RISK','OVERDUE','CRITICAL'].includes((overdueMap.get(row.loan_id)||{}).bucket)).length,[filteredRows,overdueMap])
  const totalDisbursed=useMemo(()=>round2(filteredRows.reduce((sum,row)=>sum+Number(row.disbursed_amount||0),0)),[filteredRows])
  const totalBalancePrincipal=useMemo(()=>round2(filteredRows.reduce((sum,row)=>sum+Number(row.balance_principal||0),0)),[filteredRows])
  const totalMonthlyInterestDue=useMemo(()=>round2(filteredRows.filter((row)=>row.raw_status==='ACTIVE').reduce((sum,row)=>sum+Number(row.monthly_interest_due||0),0)),[filteredRows])
  const addLoanNewDisbursed=useMemo(()=>round2(Math.max(0,Number(form.new_disbursed_amount||0))),[form.new_disbursed_amount])
  const addLoanAddOn=useMemo(()=>round2(Math.max(0,Number(form.add_on_principal||0))),[form.add_on_principal])
  const addLoanTotalPrincipal=useMemo(()=>round2(addLoanNewDisbursed+addLoanAddOn),[addLoanNewDisbursed,addLoanAddOn])
  const addLoanCandidateLoans=useMemo(()=>computedRows.filter((loan)=>loan.customer_id===form.customer_id&&loan.raw_status==='ACTIVE'),[computedRows,form.customer_id])
  const addLoanSourceOptions=useMemo(()=>buildRolloverSourceOptions(addLoanCandidateLoans),[addLoanCandidateLoans])
  const selectedAddLoanSource=useMemo(()=>addLoanCandidateLoans.find((loan)=>loan.loan_id===form.rollover_source_loan_id)||null,[addLoanCandidateLoans,form.rollover_source_loan_id])
  const addLoanWorkflow=useMemo(()=>buildLoanWorkflowSummary(selectedAddLoanSource,addLoanNewDisbursed,addLoanAddOn),[selectedAddLoanSource,addLoanNewDisbursed,addLoanAddOn])
  const customerHistoryLoans=useMemo(()=>computedRows.filter((loan)=>loan.customer_id===form.customer_id).sort((a,b)=>String(b.start_date_iso||b.start_date||'').localeCompare(String(a.start_date_iso||a.start_date||''))||String(b.loan_id||'').localeCompare(String(a.loan_id||''))),[computedRows,form.customer_id])

  useEffect(()=>{
    setForm((current)=>{
      const addOnValue=round2(Math.max(0,Number(current.add_on_principal||0)))
      const validIds=new Set(addLoanCandidateLoans.map((loan)=>loan.loan_id))
      let nextSourceLoanId=current.rollover_source_loan_id||''
      if(addOnValue<=0){
        nextSourceLoanId=''
      }else{
        if(nextSourceLoanId&&!validIds.has(nextSourceLoanId))nextSourceLoanId=''
        if(!nextSourceLoanId&&addLoanCandidateLoans.length===1)nextSourceLoanId=addLoanCandidateLoans[0].loan_id
      }
      if(nextSourceLoanId===current.rollover_source_loan_id)return current
      return {...current,rollover_source_loan_id:nextSourceLoanId}
    })
  },[addLoanCandidateLoans,form.customer_id,form.add_on_principal])

  const save=async(e)=>{
    e.preventDefault()
    const newDisbursed=addLoanNewDisbursed
    const addOn=addLoanAddOn
    const totalPrincipal=addLoanTotalPrincipal
    const pre=Number(form.pre_deducted_interest||0)
    if(!form.customer_id)return toast('error','Loan not saved','Select a customer before saving the loan.')
    if(totalPrincipal<=0)return toast('error','Loan not saved','Enter a new disbursed amount, an add-on principal, or both before saving the loan.')
    if(form.transaction_type!=='DEBT'&&pre>0)return toast('error','Loan not saved','Only DEBT loans can deduct interest upfront.')
    if(addOn>0&&!form.rollover_source_loan_id)return toast('error','Loan not saved','Select the source loan that should be completed for this rollover.')
    if(addOn>0&&!selectedAddLoanSource)return toast('error','Loan not saved','The selected rollover source loan is no longer active. Refresh and try again.')
    if(addOn>0&&selectedAddLoanSource&&addOn>round2(Number(selectedAddLoanSource.balance_principal||0)))return toast('error','Loan not saved',`Add-on principal cannot exceed ${selectedAddLoanSource.loan_display_id||loanDisplayId(selectedAddLoanSource.loan_id)} outstanding ${inr(selectedAddLoanSource.balance_principal)}.`)

    const payload={
      customer_id:form.customer_id,
      principal_amount:totalPrincipal,
      new_disbursed_amount:newDisbursed,
      add_on_principal:addOn,
      rollover_source_loan_id:addOn>0?(form.rollover_source_loan_id||''):'',
      interest_rate:Number(form.interest_rate||0),
      loan_type:'PERSONAL',
      transaction_type:form.transaction_type,
      start_date:form.start_date,
      tenure_months:form.tenure_months?Number(form.tenure_months):null,
      status:form.status,
      fund_source:'',
      debt_interest_mode:form.transaction_type==='DEBT'?form.debt_interest_mode:'subsequent_collection',
      pre_deducted_interest:form.transaction_type==='DEBT'&&form.debt_interest_mode==='upfront_deduction'?pre:0,
      notes:form.notes
    }

    setSaving(true)
    try{
      const created=await api.createLoan(payload)
      await load()
      setForm({customer_id:'',new_disbursed_amount:'',add_on_principal:'0',rollover_source_loan_id:'',interest_rate:'0.02',transaction_type:'KULU',debt_interest_mode:'subsequent_collection',pre_deducted_interest:'0',start_date:toInputDate(new Date()),tenure_months:'',status:'ACTIVE',notes:''})
      toast('success','Loan created','The loan has been added.')
      const detail=addOn>0&&selectedAddLoanSource?`${loanDisplayId(created.loan_id)} was added. ${selectedAddLoanSource.loan_display_id||loanDisplayId(selectedAddLoanSource.loan_id)} was closed and the old balance move entry for ${inr(addOn)} was added automatically.`:`${loanDisplayId(created.loan_id)} was added and now appears in the live loan table.`
      openNoticeModal({title:'Loan created',subtitle:'The new loan is ready to use.',body:detail})
    }catch(err){
      toast('error','Loan not saved',err.message)
    }finally{
      setSaving(false)
    }
  }

  const handleLoanEdit=async(row)=>{
    try{
      const changed=await openLoanEditModal(row,{loanRows:computedRows})
      if(changed)await load()
    }catch(err){
      toast('error','Loan edit unavailable',err?.message||'Unable to edit this loan right now.')
    }
  }
  const handleLoanDelete=async(row)=>{
    if(!(await requireDoubleConfirmation({action:'Delete',subject:`loan ${row.loan_display_id||row.loan_id}`,detail:'This will permanently remove the loan record. Linked payments will block the delete.'})))return
    try{
      await api.deleteLoan(row.loan_id)
      setRows((current)=>current.filter((item)=>item.loan_id!==row.loan_id))
      setPayments((current)=>current.filter((item)=>item.loan_id!==row.loan_id))
      toast('success','Loan deleted',`${row.loan_display_id||row.loan_id} was removed.`)
    }catch(err){
      toast('error','Loan not deleted',err.message)
    }
  }

  const columns=[
    {key:'loan_display_id',label:'Loan ID',render:(row)=><button type="button" className="btn sec" style={{minHeight:28,padding:'4px 8px'}} title="Click to copy" onClick={()=>copyToClipboard(row.loan_display_id).then(()=>toast('success','Copied','Loan ID copied.'))}>{row.loan_display_id}</button>},
    {key:'customer_name',label:'Customer Name'},
    {key:'disbursed_amount',label:'Money Given',render:(row)=>inr(row.disbursed_amount),getValue:(row)=>row.disbursed_amount},
    {key:'rate_label',label:'Interest Rate',getValue:(row)=>getLoanInterestRate(row)},
    {key:'start_date',label:'Loan Start Date',render:(row)=>fmtDate(row.start_date),getValue:(row)=>row.start_date_iso||row.start_date||''},
    {key:'display_status',label:'Loan Status',render:(row)=><Status value={row.display_status} />,getValue:(row)=>row.display_status},
    {key:'total_principal_repaid',label:'Principal Paid Back',render:(row)=>inr(row.total_principal_repaid),getValue:(row)=>row.total_principal_repaid},
    {key:'balance_principal',label:'Amount Still Due',render:(row)=>inr(row.balance_principal),getValue:(row)=>row.balance_principal},
    {key:'monthly_interest_due',label:'This Month Interest',render:(row)=>inr(row.monthly_interest_due),getValue:(row)=>row.monthly_interest_due},
    {key:'last_payment_date',label:'Last Payment Date',getValue:(row)=>row.last_payment_date_iso||''},
    {key:'remarks',label:'Remarks',render:(row)=>truncateText(row.remarks),tooltip:(row)=>row.remarks},
    {key:'actions',label:'Actions',render:(row)=><div className="table-actions"><button type="button" className="btn sec" onClick={()=>handleLoanEdit(row)}>Edit</button>{canDeleteRecords(currentUser)&&<button type="button" className="btn sec" onClick={()=>handleLoanDelete(row)}>Delete</button>}</div>,getValue:()=>''}
  ]

  return<SummaryPage title={copy.pages.loans} subtitle={TXT(lang,'Add loans inline and manage the live balance-principal table from one place.','ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â®ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â²ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¯ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€¦Ã‚Â¸ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â©ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯Ãƒâ€šÃ‚Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚ÂªÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¤ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¿ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚ÂµÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯Ãƒâ€šÃ‚Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¯ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯Ãƒâ€šÃ‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¤ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯Ãƒâ€šÃ‚Â, balance principal ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¦ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€¦Ã‚Â¸ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯Ãƒâ€šÃ‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€¦Ã‚Â¸ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚ÂµÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â£ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯Ãƒâ€¹Ã¢â‚¬Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¯ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯Ãƒâ€¹Ã¢â‚¬Â  ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€¦Ã‚Â¸ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¤ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯Ãƒâ€šÃ‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¤ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¿ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â²ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯Ãƒâ€šÃ‚Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¨ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¿ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯Ãƒâ€šÃ‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚ÂµÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¿ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯Ãƒâ€šÃ‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â²ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â¾ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â®Ãƒâ€šÃ‚Â®ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¯Ãƒâ€šÃ‚Â.')}>
    <div className="workspace-grid">
    <div className="card inline-form entry-panel">
      <div className="chead"><div><h3 className="ct">Add Loan</h3><p className="cs">The add-loan form is pinned at the top so data entry stays visible.</p></div></div>
      <form onSubmit={save} className="inline-form">
        <div className="inline-grid">
          <CustomerField label="Customer" customers={customerState.options} value={form.customer_id} onChange={(value)=>setForm({...form,customer_id:value})} loading={customerState.loading} error={customerState.error} />
          <div className="fld"><label>Loan Type</label><select value={form.transaction_type} onChange={(e)=>setForm({...form,transaction_type:e.target.value,debt_interest_mode:e.target.value==='DEBT'?form.debt_interest_mode:'subsequent_collection',pre_deducted_interest:e.target.value==='DEBT'?form.pre_deducted_interest:'0'})}><option value="KULU">KULU</option><option value="DEBT">DEBT</option></select></div>
          <div className="fld"><label>New Money Given</label><input inputMode="decimal" value={form.new_disbursed_amount} onChange={(e)=>setForm({...form,new_disbursed_amount:e.target.value})} /><span className="helper">This is the new cash you are giving now.</span></div>
          <div className="fld"><label>Old Unpaid Amount</label><input inputMode="decimal" value={form.add_on_principal} onChange={(e)=>setForm({...form,add_on_principal:e.target.value})} /><span className="helper">Use this only for the old balance moved from a previous loan.</span></div>
          <div className="fld"><label>Total Loan Amount</label><input inputMode="decimal" value={addLoanTotalPrincipal?String(addLoanTotalPrincipal):'0'} readOnly /></div>
          {addLoanAddOn>0?<SearchableSelectField label="Loan To Close" options={addLoanSourceOptions} value={form.rollover_source_loan_id} onChange={(value)=>setForm({...form,rollover_source_loan_id:value})} placeholder={addLoanCandidateLoans.length?'Search old loan ID':'No active loans found'} error={form.customer_id&&addLoanAddOn>0&&!addLoanCandidateLoans.length?'This customer has no active loan available to close.':''} />:null}
          <div className="fld"><label>Interest Rate</label><input inputMode="decimal" value={form.interest_rate} onChange={(e)=>setForm({...form,interest_rate:e.target.value})} /></div>
          <DateField label="Start Date" value={form.start_date} onChange={(value)=>setForm({...form,start_date:value})} />
          <div className="fld"><label>Tenure (Months)</label><input inputMode="numeric" value={form.tenure_months} onChange={(e)=>setForm({...form,tenure_months:e.target.value})} /></div>
          <div className="fld"><label>Status</label><select value={form.status} onChange={(e)=>setForm({...form,status:e.target.value})}>{SOURCE_LOAN_STATUS_OPTIONS.map((item)=><option key={item.value} value={item.value}>{item.label}</option>)}</select></div>
          {form.transaction_type==='DEBT'&&<>
            <div className="fld"><label>DEBT Interest Mode</label><select value={form.debt_interest_mode} onChange={(e)=>setForm({...form,debt_interest_mode:e.target.value})}><option value="subsequent_collection">Subsequent Collection</option><option value="upfront_deduction">Upfront Deduction</option></select></div>
            <div className="fld"><label>Pre-Deducted Interest</label><input inputMode="decimal" value={form.pre_deducted_interest} onChange={(e)=>setForm({...form,pre_deducted_interest:e.target.value})} disabled={form.debt_interest_mode!=='upfront_deduction'} /></div>
          </>}
        </div>
        <div className="info" style={{display:'grid',gap:6}}>
          <strong>Before you save</strong>
          {addLoanWorkflow.lines.map((line,index)=><span key={`${line}-${index}`}>{line}</span>)}
        </div>
        <div className="fld"><label>Remarks / Note</label><textarea value={form.notes} onChange={(e)=>setForm({...form,notes:e.target.value})}></textarea></div>
        <div className="acts"><button className="btn pri" type="submit" disabled={saving} aria-busy={saving}>{saving?'Saving...':'Save Loan'}</button></div>
      </form>
    </div>
    <div className="card history-card">
      <div className="chead"><div><h3 className="ct">Previous Loans</h3><p className="cs">Pick a customer to review earlier loans while entering a new one.</p></div></div>
      {form.customer_id?customerHistoryLoans.length?<div className="history-list">{customerHistoryLoans.slice(0,8).map((loan)=><div className="history-row" key={loan.loan_id}><div className="history-row-head"><div className="history-row-title"><strong>{loan.loan_display_id}</strong><span>{fmtDate(loan.start_date)} | {loan.transaction_type}</span></div><Status value={loan.display_status} /></div><div className="history-row-meta"><span>Money given: {inr(loan.disbursed_amount)}</span><span>Amount still due: {inr(loan.balance_principal)}</span><span>Interest rate: {loan.rate_label}</span><span>Last payment: {loan.last_payment_date?fmtDate(loan.last_payment_date):'-'}</span></div>{loan.remarks?<div className="history-row-note">{truncateText(loan.remarks,120)}</div>:null}</div>)}</div>:<div className="history-empty">No earlier loans for this customer yet.</div>:<div className="history-empty">Select a customer to view earlier loan records here.</div>}
    </div>
    </div>
    <div className="card filter-card"><div className="filters"><CustomerField label="Customer" customers={customerState.options} value={filters.customer_id} onChange={(value)=>setFilters({...filters,customer_id:value})} loading={customerState.loading} error={customerState.error} allowAll /><div className="fld"><label>Loan Type</label><select value={filters.loan_type} onChange={(e)=>setFilters({...filters,loan_type:e.target.value})}><option value="ALL">All</option><option value="KULU">KULU</option><option value="DEBT">DEBT</option></select></div><div className="fld"><label>Loan Status</label><select value={filters.status} onChange={(e)=>setFilters({...filters,status:e.target.value})}>{loanStatusOptions.map((item)=><option key={item.value} value={item.value}>{item.label}</option>)}</select></div><div className="fld"><label>Overdue Status</label><select value={filters.overdue} onChange={(e)=>setFilters({...filters,overdue:e.target.value})}><option value="ALL">All</option><option value="AT_RISK">Slightly Behind</option><option value="OVERDUE">Overdue</option><option value="CRITICAL">Severely Overdue</option></select></div><DateField label="Loan Disbursed From" value={filters.disbursed_from} onChange={(value)=>setFilters({...filters,disbursed_from:value})} /><DateField label="Loan Disbursed To" value={filters.disbursed_to} onChange={(value)=>setFilters({...filters,disbursed_to:value})} /></div></div>
    {!loading&&!error&&<div className="stats"><Metric label="Loans in Scope" value={filteredRows.length} meta="Filtered live loan ledger" /><Metric label="New Money Given" value={inr(totalDisbursed)} meta={`${activeLoanCount} active loans`} /><Metric label="Amount Still Due" value={inr(totalBalancePrincipal)} meta="Current amount yet to be collected" /><Metric label="This Month Interest" value={inr(totalMonthlyInterestDue)} meta="Interest expected from active loans" /><Metric label="Overdue Loans" value={overdueLoanCount} meta="At risk, overdue, and critical buckets" /></div>}
    <div className="card">{loading?<Loading label="Loading loans..." />:error?<ErrorBox title="Loans unavailable" body={error} onRetry={load} retryLabel={copy.common.retry} />:filteredRows.length?<TableCards keyField="loan_id" filename="loan-management.csv" rows={filteredRows} columns={columns} footerBuilder={({rows,visibleColumns,search})=>{const activeRows=rows.filter((row)=>row.raw_status==='ACTIVE');const totalBalance=round2(activeRows.reduce((sum,row)=>sum+row.balance_principal,0));const totalInterest=round2(activeRows.reduce((sum,row)=>sum+row.monthly_interest_due,0));const filtered=hasPageFilters||!!search;return<tr>{visibleColumns.map((column,index)=><td key={column.key}>{index===0?<strong>{`TOTAL${filtered?' (filtered)':''}`}</strong>:column.key==='balance_principal'?inr(totalBalance):column.key==='monthly_interest_due'?inr(totalInterest):''}</td>)}</tr>}} />:<Empty title="No loans found" body="Adjust the filters or add the first loan above." />}</div>
  </SummaryPage>
}

function PaymentsEnhancedV2({toast,customerState,currentUser,copy,lang}){
  const [loading,setLoading]=useState(true)
  const [error,setError]=useState('')
  const [payments,setPayments]=useState([])
  const [loans,setLoans]=useState([])
  const [customerLoans,setCustomerLoans]=useState([])
  const [customerHistoryPayments,setCustomerHistoryPayments]=useState([])
  const [form,setForm]=useState({customer_id:'',loan_id:'',payment_date:toInputDate(new Date()),payment_method:'CASH',principal_amount:'',interest_amount:'',total_amount:'',help_category:'None',notes:''})
  const [filters,setFilters]=useState({customer_id:'',payment_method:'ALL',start_date:'',end_date:''})
  const [saving,setSaving]=useState(false)

  const load=async()=>{
    setLoading(true)
    setError('')
    try{
      const [loanRows,paymentRows]=await Promise.all([
        api.getLoans(),
        api.getPayments({
          customer_id:filters.customer_id||undefined,
          payment_method:filters.payment_method==='ALL'?undefined:filters.payment_method,
          start_date:filters.start_date||undefined,
          end_date:filters.end_date||undefined
        })
      ])
      setLoans(loanRows)
      setPayments(decoratePayments(paymentRows,loanRows))
    }catch(err){
      setError(err.message)
      toast('error','Payments unavailable',err.message)
    }finally{
      setLoading(false)
    }
  }

  useEffect(()=>{load()},[filters.customer_id,filters.payment_method,filters.start_date,filters.end_date])

  useEffect(()=>{
    const fetchCustomerContext=async()=>{
      if(!form.customer_id){
        setCustomerLoans([])
        setCustomerHistoryPayments([])
        return
      }
      try{
        const [loanRows,paymentRows]=await Promise.all([
          api.getLoans({customer_id:form.customer_id}),
          api.getPayments({customer_id:form.customer_id})
        ])
        const decoratedHistory=decoratePayments(paymentRows,loanRows)
        const activeLoanRows=buildLoanComputedRows(loanRows,decoratedHistory).filter((loan)=>loan.raw_status==='ACTIVE')
        setCustomerLoans(loanRows)
        setCustomerHistoryPayments(decoratedHistory)
        setForm((current)=>{
          let nextLoanId=current.loan_id||''
          const activeLoanIds=new Set(activeLoanRows.map((loan)=>loan.loan_id))
          if(nextLoanId&&!activeLoanIds.has(nextLoanId))nextLoanId=''
          if(!nextLoanId&&activeLoanRows.length===1)nextLoanId=activeLoanRows[0].loan_id
          return nextLoanId===current.loan_id?current:{...current,loan_id:nextLoanId}
        })
      }catch(err){
        setCustomerLoans([])
        setCustomerHistoryPayments([])
        toast('error','Customer payments unavailable',err.message)
      }
    }
    fetchCustomerContext()
  },[form.customer_id])

  const derivedCustomerLoans=useMemo(()=>buildLoanComputedRows(customerLoans,customerHistoryPayments),[customerLoans,customerHistoryPayments])
  const derivedActiveLoans=useMemo(()=>derivedCustomerLoans.filter((loan)=>loan.raw_status==='ACTIVE'),[derivedCustomerLoans])
  const selectedLoan=useMemo(()=>derivedActiveLoans.find((loan)=>loan.loan_id===form.loan_id)||null,[derivedActiveLoans,form.loan_id])
  const customerRecentPayments=useMemo(()=>customerHistoryPayments.filter((payment)=>!isVirtualPayment(payment)).sort((a,b)=>String(b.payment_date_iso||b.payment_date||'').localeCompare(String(a.payment_date_iso||a.payment_date||''))||String(b.payment_id||'').localeCompare(String(a.payment_id||''))).slice(0,8),[customerHistoryPayments])
  const visibleHistoryPayments=useMemo(()=>customerRecentPayments.filter((payment)=>!form.loan_id||payment.loan_id===form.loan_id),[customerRecentPayments,form.loan_id])
  const loanOptions=useMemo(()=>derivedActiveLoans.map((loan)=>({value:loan.loan_id,label:`${loan.loan_display_id} | ${loan.transaction_type} | ${inr(loan.balance_principal)}`,searchText:`${loan.loan_display_id} ${loan.customer_name} ${loan.transaction_type}`})),[derivedActiveLoans])

  const currentInterestDue=(loan)=>loan?round2(Math.max(0,Number(loan.balance_principal||0))*getLoanInterestRate(loan)):0
  const projectedRemainingPrincipal=(loan,principalValue)=>round2(Math.max(0,Number(loan?.balance_principal||0)-Math.max(0,Number(principalValue||0))))
  const nextProjectedInterestDue=(loan,principalValue)=>round2(projectedRemainingPrincipal(loan,principalValue)*getLoanInterestRate(loan))
  const syncSplit=(next)=>{
    const principal=Number(next.principal_amount||0)
    const interest=Number(next.interest_amount||0)
    return {...next,total_amount:principal||interest?String(round2(principal+interest)):next.total_amount}
  }

  useEffect(()=>{
    if(!selectedLoan)return
    setForm((current)=>syncSplit({...current,interest_amount:String(currentInterestDue(selectedLoan))}))
  },[selectedLoan?.loan_id,selectedLoan?.balance_principal,selectedLoan?.interest_rate])

  const interestHelper=selectedLoan
    ? selectedLoan.balance_principal>0
      ? `This month interest on ${inr(selectedLoan.balance_principal)} @ ${selectedLoan.rate_label}: ${inr(currentInterestDue(selectedLoan))}. Next month, after this principal payment, projected interest on ${inr(projectedRemainingPrincipal(selectedLoan,form.principal_amount))}: ${inr(nextProjectedInterestDue(selectedLoan,form.principal_amount))}`
      : 'No outstanding principal for this loan.'
    : ''

  const totalCollected=useMemo(()=>round2(payments.reduce((sum,payment)=>sum+getCashTotalAmount(payment),0)),[payments])
  const principalCollected=useMemo(()=>round2(payments.reduce((sum,payment)=>sum+getCashPrincipalAmount(payment),0)),[payments])
  const interestCollected=useMemo(()=>round2(payments.reduce((sum,payment)=>sum+getCashInterestAmount(payment),0)),[payments])
  const paidCustomers=useMemo(()=>new Set(payments.filter((payment)=>getCashTotalAmount(payment)>0).map((payment)=>payment.customer_id).filter(Boolean)).size,[payments])
  const hasPageFilters=useMemo(()=>Object.entries(filters).some(([key,value])=>String(value||'')&&String(value)!=='ALL'),[filters])

  const save=async(e)=>{
    e.preventDefault()
    const principal=Number(form.principal_amount||0)
    const interest=Number(form.interest_amount||0)
    const total=Number(form.total_amount||0)
    if(!form.customer_id||!form.loan_id)return toast('error','Payment not saved','Select both customer and loan.')
    if(principal<=0&&interest<=0&&total<=0)return toast('error','Payment not saved','At least one of principal or interest must be greater than zero.')

    const payload={
      loan_id:form.loan_id,
      customer_id:form.customer_id,
      payment_date:form.payment_date,
      amount:total||principal+interest,
      total_amount:total||principal+interest,
      principal_amount:principal,
      interest_amount:interest,
      payment_method:form.payment_method,
      help_category:form.help_category,
      help_note:'',
      repayment_date:null,
      repayment_amount:null,
      help_status:'Active',
      notes:form.notes
    }

    setSaving(true)
    try{
      const created=await api.createPayment(payload)
      const customerName=(customerState.options||[]).find((customer)=>(customer.customer_id||customer.id)===form.customer_id)?.name||selectedLoan?.customer_name||''
      const optimistic={...created,...payload,payment_date:payload.payment_date,payment_date_iso:created.payment_date_iso||payload.payment_date,customer_name:created.customer_name||customerName,loan_display_id:selectedLoan?.loan_display_id||loanDisplayId(payload.loan_id)}
      setPayments((current)=>[optimistic,...current.filter((item)=>item.payment_id!==optimistic.payment_id)])
      setCustomerHistoryPayments((current)=>[optimistic,...current.filter((item)=>item.payment_id!==optimistic.payment_id)])
      setForm({customer_id:'',loan_id:'',payment_date:toInputDate(new Date()),payment_method:'CASH',principal_amount:'',interest_amount:'',total_amount:'',help_category:'None',notes:''})
      setCustomerLoans([])
      setCustomerHistoryPayments([])
      toast('success','Payment saved','The transaction has been recorded successfully.')
      openNoticeModal({title:'Payment saved',subtitle:'The collection entry was recorded.',body:`${selectedLoan?.loan_display_id||loanDisplayId(payload.loan_id)} was updated and now appears at the top of the table.`})
      emitPaymentSaved(payload)
    }catch(err){
      toast('error','Payment not saved',err.message)
    }finally{
      setSaving(false)
    }
  }

  const handlePaymentEdit=async(row)=>{
    try{
      const changed=await openPaymentEditModal(row)
      if(changed){
        await load()
        if(form.customer_id===row.customer_id){
          const [loanRows,paymentRows]=await Promise.all([
            api.getLoans({customer_id:row.customer_id}),
            api.getPayments({customer_id:row.customer_id})
          ])
          setCustomerLoans(loanRows)
          setCustomerHistoryPayments(decoratePayments(paymentRows,loanRows))
        }
      }
    }catch(err){
      toast('error','Payment edit unavailable',err?.message||'Unable to edit this payment right now.')
    }
  }

  const handlePaymentDelete=async(row)=>{
    if(!(await requireDoubleConfirmation({action:'Delete',subject:`payment ${row.payment_id}`,detail:'This will permanently remove the payment record. HELP-linked payments cannot be deleted.'})))return
    try{
      await api.deletePayment(row.payment_id)
      setPayments((current)=>current.filter((item)=>item.payment_id!==row.payment_id))
      setCustomerHistoryPayments((current)=>current.filter((item)=>item.payment_id!==row.payment_id))
      emitPaymentSaved({loan_id:row.loan_id,customer_id:row.customer_id})
      toast('success','Payment deleted',`${row.payment_id} was removed.`)
    }catch(err){
      toast('error','Payment not deleted',err.message)
    }
  }

  const columns=[
    {key:'payment_date',label:'Date',render:(row)=>fmtDate(row.payment_date),getValue:(row)=>row.payment_date_iso||row.payment_date||''},
    {key:'loan_display_id',label:'Loan ID',render:(row)=><button type="button" className="btn sec" style={{minHeight:28,padding:'4px 8px'}} title="Click to copy" onClick={()=>copyToClipboard(row.loan_display_id||loanDisplayId(row.loan_id)).then(()=>toast('success','Copied','Loan ID copied.'))}>{row.loan_display_id||loanDisplayId(row.loan_id)}</button>},
    {key:'customer_name',label:'Customer'},
    {key:'principal_amount',label:'Principal',render:(row)=>inr(getCashPrincipalAmount(row)),getValue:(row)=>getCashPrincipalAmount(row)},
    {key:'interest_amount',label:'Interest',render:(row)=>inr(getCashInterestAmount(row)),getValue:(row)=>getCashInterestAmount(row)},
    {key:'payment_total',label:'Payment',render:(row)=>inr(getCashTotalAmount(row)),getValue:(row)=>getCashTotalAmount(row)},
    {key:'payment_method',label:'Method',render:(row)=>isVirtualPayment(row)?<span className="badge warn">Virtual rollover</span>:<span>{row.payment_method||'-'}</span>,getValue:(row)=>row.payment_method||''},

              <div className="fld"><label>Search</label><input value={transactionFilters.search} onChange={(e)=>setTransactionFilters({...transactionFilters,search:e.target.value})} placeholder="Search customer, loan ID, method, or remarks" /></div>
              <div className="fld"><label>Profitability</label><select value={transactionFilters.profitability} onChange={(e)=>setTransactionFilters({...transactionFilters,profitability:e.target.value})}><option value="ALL">All</option><option value="PROFIT">Profit</option><option value="LOSS">Loss</option><option value="BREAKEVEN">Breakeven</option></select></div>
              <div className="fld"><label>Balance Status</label><select value={transactionFilters.balance} onChange={(e)=>setTransactionFilters({...transactionFilters,balance:e.target.value})}><option value="ALL">All</option><option value="OUTSTANDING">Outstanding</option><option value="CLOSED">Closed Balance</option></select></div>
              <div className="fld"><label>Payment Method</label><select value={transactionFilters.payment_method} onChange={(e)=>setTransactionFilters({...transactionFilters,payment_method:e.target.value})}><option value="ALL">All Methods</option>{transactionMethodOptions.map((method)=><option key={method} value={method}>{method}</option>)}</select></div>
              <div className="fld"><label>Aging Bucket</label><select value={transactionFilters.aging_bucket} onChange={(e)=>setTransactionFilters({...transactionFilters,aging_bucket:e.target.value})}><option value="ALL">All Buckets</option><option value="CURRENT">Up to Date</option><option value="AT_RISK">Slightly Behind</option><option value="OVERDUE">Overdue</option><option value="CRITICAL">Severely Overdue</option></select></div>
            </div>
          </div>
          <div className="report-detail-layout">
            <div className="report-primary">
              {filteredTransactionRows.length?<TableCards keyField="row_id" filename="customer-transactions-report.csv" rows={filteredTransactionRows} footerBuilder={({rows,visibleColumns})=>{const totalPayment=round2(rows.reduce((sum,row)=>sum+Number(row.payment||0),0));const totalPrincipal=round2(rows.reduce((sum,row)=>sum+Number(row.principal_collected||0),0));const totalInterest=round2(rows.reduce((sum,row)=>sum+Number(row.interest_collected||0),0));const totalProfit=round2(rows.reduce((sum,row)=>sum+Number(row.profit_loss||0),0));const uniqueLoanIds=new Set(rows.map((row)=>row.loan_id));const currentOutstanding=round2(filteredComputedRows.filter((row)=>uniqueLoanIds.has(row.loan_id)).reduce((sum,row)=>sum+Number(row.balance_principal||0),0));return<tr>{visibleColumns.map((column,index)=><td key={column.key}>{index===0?<strong>Total</strong>:column.key==='payment'?inr(totalPayment):column.key==='principal_collected'?inr(totalPrincipal):column.key==='interest_collected'?inr(totalInterest):column.key==='balance_principal'?inr(currentOutstanding):column.key==='interest_accrued'?'':column.key==='profit_loss'?inr(totalProfit):''}</td>)}</tr>}} columns={[
                {key:'customer_name',label:'Customer'},
                {key:'loan_display_id',label:'Loan ID',render:(row)=><button type="button" className={`btn ${selectedReportLoanId===row.loan_id?'pri':'sec'}`} style={{minHeight:28,padding:'4px 8px'}} onClick={()=>setSelectedReportLoanId(row.loan_id)}>{row.loan_display_id}</button>,getValue:(row)=>row.loan_display_id},
                {key:'payment',label:'Payment',render:(row)=>inr(row.payment),getValue:(row)=>row.payment},
                {key:'principal_collected',label:'Principal Paid Back',render:(row)=>inr(row.principal_collected),getValue:(row)=>row.principal_collected},
                {key:'interest_collected',label:'Interest Collected',render:(row)=>inr(row.interest_collected),getValue:(row)=>row.interest_collected},
                {key:'balance_principal',label:'Amount Still Due',render:(row)=>inr(row.balance_principal),getValue:(row)=>row.balance_principal},
                {key:'interest_accrued',label:'Interest Accrued',render:(row)=>inr(row.interest_accrued),getValue:(row)=>row.interest_accrued},
                {key:'profit_loss',label:'Profit / Loss',render:(row)=><span className={row.profit_loss>=0?'profit-pos':'profit-neg'}>{inr(row.profit_loss)}</span>,getValue:(row)=>row.profit_loss},
                {key:'last_payment',label:'Last Payment'},
                {key:'payment_method',label:'Payment Method'},
                {key:'aging_bucket',label:'Aging Bucket',render:(row)=>{const info=reportOverdueMap.get(row.loan_id)||{};const bucketClass=info.bucket==='CRITICAL'?'aging-critical':info.bucket==='OVERDUE'?'aging-overdue':info.bucket==='AT_RISK'?'aging-atrisk':'aging-current';return<span className={`aging-badge ${bucketClass}`}>{info.label||'Up to Date'}</span>},getValue:(row)=>(reportOverdueMap.get(row.loan_id)||{}).label||'Up to Date'},
                {key:'remarks',label:'Remarks',render:(row)=>truncateText(row.remarks),tooltip:(row)=>row.remarks}
              ]} />:<Empty title="No customer transactions" body="No transactions match the current report filters." />}
            </div>
            <div className="card report-side">
              <div className="chead"><div><h3 className="ct">Selected Loan</h3><p className="cs">Click any loan ID in the table to inspect its current position and payment timeline.</p></div></div>
              {selectedReportLoan?<><div className="report-loan-summary">
                <div className="chip"><strong>Loan ID</strong><span>{selectedReportLoan.loan_display_id}</span></div>
                <div className="chip"><strong>Customer</strong><span>{selectedReportLoan.customer_name}</span></div>
                <div className="chip"><strong>Type</strong><span>{selectedReportLoan.transaction_type}</span></div>
                <div className="chip"><strong>New Money Given</strong><span>{inr(selectedReportLoan.disbursed_amount)}</span></div>
                <div className="chip"><strong>Old Unpaid Amount</strong><span>{inr(getLoanAddOnPrincipalAmount(selectedReportLoan))}</span></div>
                <div className="chip"><strong>Total Loan Amount</strong><span>{inr(getLoanContractualPrincipalAmount(selectedReportLoan))}</span></div>
                <div className="chip"><strong>Amount Still Due</strong><span>{inr(selectedReportLoan.balance_principal)}</span></div>
                <div className="chip"><strong>Rate</strong><span>{selectedReportLoan.rate_label}</span></div>
                <div className="chip"><strong>Status</strong><span>{statusLabel(selectedReportLoan.display_status)}</span></div>
                <div className="chip"><strong>Last Payment</strong><span>{selectedReportLoan.last_payment_date||'-'}</span></div>
              </div>
              {selectedReportTimeline.length?<div className="wrap"><table className="tbl"><thead><tr><th>Period</th><th>Date</th><th>Principal</th><th>Interest</th><th>Total</th><th>Method</th><th>Status</th></tr></thead><tbody>{selectedReportTimeline.map((row)=><tr key={row.timeline_id} className={row.missing_payment?'missed-row':''}><td>{row.period_label}</td><td>{row.payment_date?fmtDate(row.payment_date):'-'}</td><td>{inr(row.principal_amount)}</td><td>{inr(row.interest_amount)}</td><td>{inr(row.total_amount)}</td><td>{row.payment_method||'-'}</td><td>{row.missing_payment?'Missed':'Recorded'}</td></tr>)}</tbody></table></div>:<Empty title="No payment timeline" body="This loan does not have any payment history in the current report scope." />}</>:<Empty title="Select a loan" body="Choose a loan ID from the transaction table to reveal the detailed view on the right." />}
            </div>
          </div>
        </div>
      </SummaryPage>
    }
    function LoginScreen({onLogin,loading,error}){
      const[form,setForm]=useState({email:'',password:''})
      const submit=async(event)=>{
        event.preventDefault()
        await onLogin(form)
      }
      return<div className="login-shell">
        <div className="login-card">
          <div className="login-hero">
            <div className="login-logo-badge">
              <img className="login-logo" src={BRAND_LOGO_URL} onError={handleBrandLogoError} alt="Vairam Fincorp" />
            </div>
            <div className="login-brand">
              <p>Welcome back. Please sign in to continue.</p>
            </div>
          </div>
          <div className="login-form-panel">
            <div className="login-form-copy">
              <h2>Login</h2>
              <p>Use your email ID and password below.</p>
            </div>
            <form onSubmit={submit} className="inline-form">
              <div className="inline-grid">
                <div className="fld"><label>Email ID</label><input type="email" value={form.email} onChange={(e)=>setForm({...form,email:e.target.value})} placeholder="name@vairamfincorp.com" autoComplete="username" /></div>
                <div className="fld"><label>Password</label><input type="password" value={form.password} onChange={(e)=>setForm({...form,password:e.target.value})} placeholder="Enter password" autoComplete="current-password" /></div>
              </div>
              {error?<div className="err" style={{marginTop:8}}>{error}</div>:null}
              <div className="acts" style={{justifyContent:'stretch',alignItems:'center'}}>
                <button className="btn pri" type="submit" disabled={loading} aria-busy={loading}>{loading?'Signing in...':'Sign In'}</button>
              </div>
            </form>
            <div className="login-help">
              <strong>Forgot password?</strong>
              <p>Please contact Mrs Vairam or Mr Kalai for password reset help.</p>
            </div>
          </div>
        </div>
      </div>
    }
    function App(){
      const[toasts,setToasts]=useState([])
      const[page,setPage]=useState(window.localStorage.getItem('diamond_page')||'dashboard')
      const[language,setLanguage]=useState(window.localStorage.getItem('diamond_lang')||'en')
      const[showSplash,setShowSplash]=useState(true)
      const[pageNonce,setPageNonce]=useState(0)
      const[customerState,setCustomerState]=useState({loading:true,error:'',options:[]})
      const[authLoading,setAuthLoading]=useState(true)
      const[currentUser,setCurrentUser]=useState(getStoredAuthSession().user||null)
      const[authError,setAuthError]=useState('')
      const[loginBusy,setLoginBusy]=useState(false)
      const idleTimerRef=useRef(null)
      const idleHeartbeatRef=useRef(null)
      const lastActivityRef=useRef(Date.now())
      const copy=repairText(LANG_COPY[language]||LANG_COPY.en)

      const toast=(type,title,body='')=>{
        const id=Date.now()+Math.random()
        setToasts((cur)=>[...cur,{id,type,title,body}])
        window.setTimeout(()=>setToasts((cur)=>cur.filter((item)=>item.id!==id)),3400)
      }

      const syncCurrentUser=(user)=>{
        const token=getAuthToken()
        if(token&&user)storeAuthSession(token,user)
        setCurrentUser(user)
      }

      const clearIdleTimer=()=>{
        if(idleTimerRef.current){
          window.clearTimeout(idleTimerRef.current)
          idleTimerRef.current=null
        }
        if(idleHeartbeatRef.current){
          window.clearInterval(idleHeartbeatRef.current)
          idleHeartbeatRef.current=null
        }
      }

      const forceSignOut=(message='Please sign in again.')=>{
        clearIdleTimer()
        clearAuthSession()
        setCurrentUser(null)
        setCustomerState({loading:false,error:'',options:[]})
        setAuthError(message)
        setPageNonce((current)=>current+1)
      }

      const restartIdleTimer=()=>{
        clearIdleTimer()
        if(!currentUser)return
        lastActivityRef.current=Date.now()
        idleTimerRef.current=window.setTimeout(()=>{
          api.logout().catch(()=>{})
          forceSignOut('Signed out after 5 minutes of inactivity. Please sign in again.')
        },AUTH_IDLE_TIMEOUT_MS)
        idleHeartbeatRef.current=window.setInterval(()=>{
          if(Date.now()-lastActivityRef.current>=AUTH_IDLE_TIMEOUT_MS){
            api.logout().catch(()=>{})
            forceSignOut('Signed out after 5 minutes of inactivity. Please sign in again.')
          }
        },15000)
      }

      const promptPasswordChange=async({forced=false,userOverride=null}={})=>{
        const activeUser=userOverride||currentUser||getStoredAuthSession().user
        if(!activeUser)return false
        return openRichFormModal({
          title:'Change Password',
          subtitle:forced?`For safety, ${activeUser.display_name||activeUser.email} should set a private password now.`:'Set a new password for this login.',
          fields:[
            {name:'current_password',label:'Current Password',type:'password',placeholder:'Enter current password'},
            {name:'new_password',label:'New Password',type:'password',placeholder:'At least 8 characters'},
            {name:'confirm_password',label:'Confirm New Password',type:'password',placeholder:'Enter the new password again'}
          ],
          submitLabel:'Update Password',
          extraContentHtml:forced?'<div class="info" style="margin-top:16px;"><strong>Safety note</strong><span>This login is still using the default password. Change it before continuing with daily work.</span></div>':'',
          onSubmit:async(values)=>{
            const currentPassword=String(values.current_password||'')
            const newPassword=String(values.new_password||'')
            const confirmPassword=String(values.confirm_password||'')
            if(!currentPassword||!newPassword||!confirmPassword)throw new Error('Fill all password fields before saving.')
            if(newPassword.length<8)throw new Error('New password must have at least 8 characters.')
            if(newPassword!==confirmPassword)throw new Error('New password and confirm password must match.')
            if(newPassword===currentPassword)throw new Error('Choose a new password that is different from the current password.')
            await api.changePassword({current_password:currentPassword,new_password:newPassword})
            const payload=await api.getMe()
            const refreshedUser={...(payload?.user||activeUser),temporary_password:false}
            syncCurrentUser(refreshedUser)
            toast('success','Password updated','The new password is active for this account.')
          }
        })
      }

      const openStaffResetModal=async()=>{
        if(!canDeleteRecords(currentUser)){
          openNoticeModal({title:'Admin access required',subtitle:'Only approved family admin logins can reset account passwords.',body:'Please use the Mrs Vairam or Mr Kalai account to reset another family member password.'})
          return false
        }
        const payload=await api.listStaffAccounts()
        const accounts=(payload?.accounts||[]).filter((account)=>account?.is_active!==false)
        if(!accounts.length){
          openNoticeModal({title:'No family accounts found',subtitle:'The family login list is empty.',body:'Check the account setup before trying another password reset.'})
          return false
        }
        const options=[{value:'',label:'Select family account'},...accounts.map((account)=>({value:account.user_id,label:`${account.display_name||account.email} - ${account.email}`}))]
        return openRichFormModal({
          title:'Reset Family Password',
          subtitle:'Set a forgotten password back to the temporary default password.',
          fields:[
            {name:'user_id',type:'select',label:'Family Account',value:'',options,helper:'Pick the login that needs a reset.'}
          ],
          submitLabel:'Reset Password',
          extraContentHtml:'<div class="info" style="margin-top:16px;"><strong>How this works</strong><span>The selected family account will be reset to the temporary password. At the next login, the app will force that person to choose a new private password.</span></div>',
          onSubmit:async(values)=>{
            const userId=String(values.user_id||'').trim()
            if(!userId)throw new Error('Select a family account before resetting the password.')
            const result=await api.resetStaffPassword(userId,{})
            openNoticeModal({
              title:'Password reset complete',
              subtitle:'Share the temporary password privately.',
              body:`${result.display_name||result.email} can now sign in with ${result.temporary_password}. Ask them to change it immediately after login.`
            })
          }
        })
      }

      const loadCustomers=async()=>{
        if(!currentUser){
          setCustomerState({loading:false,error:'',options:[]})
          return
        }
        setCustomerState((cur)=>({...cur,loading:true,error:''}))
        try{
          const options=(await api.getCustomerOptions()).map(mergeCustomerOption)
          setCustomerState({loading:false,error:'',options})
        }catch(err){
          setCustomerState({loading:false,error:err.message,options:[]})
          toast('error',TXT(language,'Customers unavailable','Customers unavailable'),err.message)
        }
      }

      const hydrateAuth=async()=>{
        const stored=getStoredAuthSession()
        if(!stored.token){
          setCurrentUser(null)
          setAuthLoading(false)
          return
        }
        try{
          const payload=await api.getMe()
          const user=payload?.user?{...payload.user,temporary_password:Boolean(payload.user.temporary_password)}:null
          if(user){
            storeAuthSession(stored.token,user)
            setCurrentUser(user)
            setAuthError('')
          }else{
            clearAuthSession()
            setCurrentUser(null)
          }
        }catch(error){
          clearAuthSession()
          setCurrentUser(null)
          setAuthError(error.message||'Please sign in again.')
        }finally{
          setAuthLoading(false)
        }
      }

      const handleLogin=async(form)=>{
        const email=String(form?.email||'').trim()
        const password=String(form?.password||'')
        if(!email||!password){
          setAuthError('Enter both email and password to continue.')
          return
        }
        setLoginBusy(true)
        setAuthError('')
        try{
          const payload=await api.login({email,password})
          const baseUser=payload?.user||null
          if(!payload?.token||!baseUser)throw new Error('Login did not return a valid session.')
          const user={...baseUser,temporary_password:Boolean(payload?.temporary_password||baseUser?.temporary_password)}
          storeAuthSession(payload.token,user)
          setCurrentUser(user)
          setPageNonce((current)=>current+1)
          toast('success','Signed in',`${user.display_name||user.email} is ready to work.`)
          if(user.temporary_password){
            window.setTimeout(()=>{
              openNoticeModal({
                title:'Change default password',
                subtitle:'This login is still using the default password.',
                body:'Please set a private password now so only the right family member can access this account.',
                okLabel:'Continue',
                onClose:()=>promptPasswordChange({forced:true,userOverride:user})
              })
            },180)
          }
        }catch(error){
          setAuthError(error.message||'Sign in failed.')
        }finally{
          setLoginBusy(false)
        }
      }

      const handleLogout=async()=>{
        try{await api.logout()}catch(error){}
        forceSignOut('')
      }

      useEffect(()=>{hydrateAuth()},[])

      useEffect(()=>{
        const onExpired=()=>{
          forceSignOut('Your session ended. Please sign in again.')
        }
        window.addEventListener('vairam-auth-expired',onExpired)
        return()=>window.removeEventListener('vairam-auth-expired',onExpired)
      },[])

      useEffect(()=>{
        if(!currentUser){
          clearIdleTimer()
          return
        }
        const reset=()=>{
          lastActivityRef.current=Date.now()
          restartIdleTimer()
        }
        const passiveEvents=['pointerdown','mousedown','touchstart','scroll','mousemove']
        const activeEvents=['keydown']
        passiveEvents.forEach((eventName)=>window.addEventListener(eventName,reset,{passive:true}))
        activeEvents.forEach((eventName)=>window.addEventListener(eventName,reset))
        document.addEventListener('visibilitychange',reset)
        restartIdleTimer()
        return()=>{
          passiveEvents.forEach((eventName)=>window.removeEventListener(eventName,reset))
          activeEvents.forEach((eventName)=>window.removeEventListener(eventName,reset))
          document.removeEventListener('visibilitychange',reset)
          clearIdleTimer()
        }
      },[currentUser])

      useEffect(()=>{
        if(!currentUser)return
        loadCustomers()
        const customerHandler=(event)=>{
          if(event?.detail?.type){
            setCustomerState((current)=>({
              ...current,
              options:mergeCustomerOptionsList(current.options,event.detail)
            }))
          }
          loadCustomers()
        }
        const appRefreshHandler=()=>{
          loadCustomers()
          setPageNonce((current)=>current+1)
        }
        window.addEventListener(CUSTOMER_OPTIONS_REFRESH_EVENT,customerHandler)
        window.addEventListener(APP_STATE_REFRESH_EVENT,appRefreshHandler)
        return()=>{
          window.removeEventListener(CUSTOMER_OPTIONS_REFRESH_EVENT,customerHandler)
          window.removeEventListener(APP_STATE_REFRESH_EVENT,appRefreshHandler)
        }
      },[currentUser,page])

      useEffect(()=>{
        normalizeVisibleMojibake()
        const root=document.getElementById('root')
        if(!root||typeof MutationObserver==='undefined')return undefined
        const observer=new MutationObserver(()=>normalizeVisibleMojibake(root))
        observer.observe(root,{childList:true,subtree:true,characterData:true})
        return()=>observer.disconnect()
      },[])

      useEffect(()=>{
        const timer=window.setTimeout(()=>setShowSplash(false),4500)
        return()=>window.clearTimeout(timer)
      },[])

      useEffect(()=>window.localStorage.setItem('diamond_page',page),[page])
      useEffect(()=>window.localStorage.setItem('diamond_lang',language),[language])
      useEffect(()=>{document.documentElement.lang=language==='ta'?'ta':'en'},[language])

      const pages={
        dashboard:<DashboardEnhancedV3 toast={toast} customerState={customerState} currentUser={currentUser} copy={copy} lang={language} />,
        customers:<CustomersV2 toast={toast} currentUser={currentUser} copy={copy} lang={language} />,
        loans:<LoansV2 toast={toast} customerState={customerState} currentUser={currentUser} copy={copy} lang={language} />,
        payments:<PaymentsEnhancedV2 toast={toast} customerState={customerState} currentUser={currentUser} copy={copy} lang={language} />,
        reports:<ReportsEnhanced toast={toast} customerState={customerState} currentUser={currentUser} copy={copy} lang={language} />
      }

      const authScreen=authLoading||!currentUser
      return<div className={authScreen?'app auth-app':'app'}>{showSplash&&<div className="splash"><div className="splash-bg"></div><div className="splash-particles"><div className="splash-particle"></div><div className="splash-particle"></div><div className="splash-particle"></div><div className="splash-particle"></div><div className="splash-particle"></div><div className="splash-particle"></div><div className="splash-particle"></div><div className="splash-particle"></div></div><div className="splash-content"><div className="splash-logo-wrap"><div className="splash-logo-ring"></div><div className="splash-logo-ring2"></div><img className="splash-logo" src={BRAND_LOGO_URL} onError={handleBrandLogoError} alt="Vairam Fincorp" /></div><h1 className="splash-title">VAIRAM FINCORP</h1><p className="splash-tagline">Finance with clarity and control</p><div className="splash-bar-track"><div className="splash-bar-fill"></div><div className="splash-bar-glow"></div></div></div></div>}{authLoading?<div className="login-shell"><Loading label="Checking your login..." /></div>:!currentUser?<LoginScreen onLogin={handleLogin} loading={loginBusy} error={authError} />:<><aside className="side"><div className="brand"><img className="brand-logo" src={BRAND_LOGO_URL} onError={handleBrandLogoError} alt="Vairam Fincorp logo" /></div><div className="user-card"><strong>{currentUser.display_name||currentUser.email}</strong><span>{currentUser.role==='ADMIN'?'Family admin access':'Family account access'}</span><small>{currentUser.temporary_password?'Default password still in use. Change it now for safety.':canViewReminderDesk(currentUser)?'Reminder view is enabled for this login.':canDeleteRecords(currentUser)?'Delete controls are enabled for this family login.':'Delete controls are locked for this family login.'}</small><button className="btn sec" type="button" onClick={()=>promptPasswordChange({forced:Boolean(currentUser.temporary_password)})}>{currentUser.temporary_password?'Change Password Now':'Change Password'}</button>{canDeleteRecords(currentUser)?<button className="btn sec" type="button" onClick={openStaffResetModal}>Reset Family Password</button>:null}<button className="btn sec" type="button" onClick={handleLogout}>Logout</button></div><div className="nav">{NAV.map(([key,icon])=><button key={key} type="button" className={page===key?'on':''} onClick={()=>setPage(key)}><span className="icon">{icon}</span><span>{copy.nav[key]}</span></button>)}</div><div className="card" style={{marginTop:18}}><div className="fld"><label>{copy.common.language}</label><select value={language} onChange={(e)=>setLanguage(e.target.value)}><option value="en">English</option><option value="ta">Tamil</option></select><span className="helper">{TXT(language,'Structure is i18n-ready without changing the current data model.','Structure is i18n-ready without changing the current data model.')}</span></div><button className="btn sec" type="button" style={{width:'100%',marginTop:12}} onClick={loadCustomers}>{copy.common.refresh}</button></div></aside><main className="main"><div className="mobile-shell"><div className="mobile-brand"><img src={BRAND_LOGO_URL} onError={handleBrandLogoError} alt="Vairam Fincorp logo" /><div><strong>VAIRAM FINCORP</strong><small>{currentUser.display_name||currentUser.email} | {currentUser.role==='ADMIN'?'Family admin access':'Family account access'}</small></div></div><div className="mobile-tools"><div className="row"><div className="fld"><label>{copy.common.language}</label><select value={language} onChange={(e)=>setLanguage(e.target.value)}><option value="en">English</option><option value="ta">Tamil</option></select></div><button className="btn sec" type="button" onClick={loadCustomers}>{copy.common.refresh}</button></div></div><div className="mobile-tabs"><button type="button" className="btn sec" onClick={()=>promptPasswordChange({forced:Boolean(currentUser.temporary_password)})}>{currentUser.temporary_password?'Change Now':'Password'}</button>{canDeleteRecords(currentUser)?<button type="button" className="btn sec" onClick={openStaffResetModal}>Reset Family</button>:null}<button type="button" className="btn sec" onClick={handleLogout}>Logout</button></div></div><ErrorBoundary key={`${page}:${pageNonce}`}>{pages[page]||pages.dashboard}</ErrorBoundary></main><nav className="mnav">{NAV.map(([key,icon])=><button key={key} type="button" className={page===key?'on':''} onClick={()=>setPage(key)}><span>{icon}</span><span>{copy.nav[key]}</span></button>)}</nav></>}<div className="toastw">{toasts.map((item)=><div key={item.id} className={`toast ${item.type||''}`}><strong>{item.title}</strong>{item.body&&<small>{item.body}</small>}</div>)}</div></div>
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    window.__appBooted=true
